services:
  agentshelf:
    build: .
    ports:
      - "8082:3010"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      APP_VERSION: "0.2.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3010/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
